name: JR06A final portfolio sync

on:
  push:
    branches: [jr06a/final-portfolio-sync]
    paths: [.github/workflows/jr06a-sync.yml]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: jr06a/final-portfolio-sync
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Synchronise final verified evidence
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing expected text in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          p = "src/lib/projects.ts"
          replace_once(p,
            '"Vitest covers unsupported claims, malformed provider output, unknown evidence IDs, prompt-shaped CV text and approval failure paths; CI runs typecheck, lint, tests, production build and dependency scanning.",',
            '"44 Vitest tests pass on the verified main commit; CI also runs typecheck, zero-warning lint, the production build and OSV scanning with no issues found.",')
          replace_once(p,
            '"Provider-selected evidence must exist in the candidate evidence bank.",',
            '"Provider mode requires an explicit ENABLE_PROVIDER_MODE=true flag plus a key; repository defaults are off, and the analysis UI shows a pre-submit beta privacy notice.",')
          replace_once(p,
            '"The tool does not auto-apply, message recruiters or guarantee interviews or employment.",',
            '"The tool does not auto-apply, message recruiters or guarantee interviews or employment; no current public JobPilot deployment is claimed.",')

          replace_once(p,
            '"A 2 August 2026 live validation passed 49 of 49 approved benchmark questions, after 85 focused local tests; that result is scoped to the approved benchmark rather than universal CSV accuracy.",',
            '"109 tests pass across Python 3.10–3.12 with Ruff, dependency auditing and a non-root Docker smoke; the historical 49/49 approved benchmark remains scoped evidence, not universal CSV accuracy.",')

          replace_once(p,
            '"Tests cover chunking, retrieval relevance, low-confidence refusal, prompt-injection inputs, strict provider output, citation allow-listing and safe provider fallback; CI also audits dependencies.",',
            '"68 tests plus a 57-case synthetic evaluation report 94.6% Hit@1, 73.0% answer accuracy and 79.0% overall accuracy, with 10.0% false answers and 24.3% over-refusal; CI also runs build, OSV and non-root Docker checks.",')
          replace_once(p,
            '"The assistant is not a substitute for reviewing the original document.",',
            '"The 57-case evaluation still contains known answer/refusal failures inside its committed threshold envelope; the assistant is not a substitute for reviewing the original document.",')

          replace_once(p,
            '"A reproducible Python and Streamlit pipeline for extracting, ranking and comparing AI/ML skills from permitted job-posting data.",',
            '"A reproducible Python/SQLite analytics pipeline for extracting and aggregating skills from a defined synthetic or permitted posting dataset.",')
          replace_once(p,
            '"Career advice often relies on anecdote. This project demonstrates a transparent way to measure skill frequency, co-occurrence and candidate gaps from a clearly defined dataset.",',
            '"Skill-analysis claims can become misleading when a small sample is presented as the labour market. This project keeps frequency, co-occurrence and entered-skill comparisons scoped to a clearly defined dataset.",')
          replace_once(p,
            '"Calculates demand frequency, skill co-occurrence and candidate-gap reports with deterministic pandas and SQL logic.",',
            '"Uses the true posting-count denominator for skill frequency, dataset-scoped co-occurrence and a literal entered-skill comparison without treating absence as a personal deficiency.",')
          replace_once(p,
            '"Tests cover empty and malformed inputs, duplicate skills, provider failures and report calculations; CI runs across Python 3.10–3.12 with Ruff and dependency auditing.",',
            '"55 tests pass across Python 3.10–3.12, including a 9-case deterministic extraction regression set; CI also runs pip check, Ruff, pip-audit and a non-root Streamlit Docker smoke.",')
          replace_once(p,
            '"Load synthetic or explicitly permitted job postings; the public repository does not scrape restricted platforms.",',
            '"Load the 40 deterministic synthetic postings or other explicitly permitted data; the public repository does not scrape restricted platforms.",')
          replace_once(p,
            '"Use deterministic taxonomy matching as the no-key default, with an optional strictly validated provider-assisted extraction path.",',
            '"Use the curated AI/ML taxonomy as the deterministic default; ESCO is a verified broad reference/lookup artefact rather than the active all-domain extractor.",')
          replace_once(p,
            '"Store posting and skill records in SQLite, then calculate frequency, co-occurrence and candidate-gap reports with pandas.",',
            '"Store posting and skill records with parameterised SQLite and duplicate protection, then calculate sample frequency, co-occurrence and entered-skill comparison outputs.",')
          replace_once(p,
            '"Results depend on the representativeness and freshness of the supplied dataset.",',
            '"The committed 40-posting sample is synthetic and non-representative; the project does not provide real-time or population-wide labour-market coverage.",')

          replace_once(p,
            '"Compares a transparent Linear Regression baseline with a Random Forest on a fixed held-out split using RMSE, MAE and R².",',
            '"Compares fixed Linear Regression and Random Forest candidates on validation RMSE, then refits the selected Random Forest and evaluates it once on an untouched final test set.",')
          replace_once(p,
            '"Held-out evaluation records both baseline and selected-model metrics; tests cover reproducible splits, model-bundle validation, feature order, invalid requests and safe failure behaviour.",',
            '"36 tests pass across Python 3.10–3.12; real-data CI regenerates committed metrics byte-for-byte, while pip check, Ruff, pip-audit, artifact compatibility and non-root Docker/API smoke gates also pass.",')
          replace_once(p,
            '"Prepare a public aggregate housing dataset with reproducible train/test handling.",',
            '"Clean 20,640 historical California Housing rows to 20,597 and split deterministically into 12,357 train, 4,120 validation and 4,120 final-test rows.",')
          replace_once(p,
            '"Train and compare a transparent baseline with a stronger tree-based model using RMSE, MAE and R².",',
            '"Select Random Forest on validation RMSE (0.5356 vs 0.6877), refit it on train + validation, then report final-test RMSE 0.4771, MAE 0.3202 and R² 0.8290.",')
          replace_once(p,
            '"Evaluation reports include the baseline and selected model instead of hiding weaker results.",',
            '"The final test does not select the model; R² 0.8290 means variance explained on this historical split, not 82.9% prediction accuracy.",')
          replace_once(p,
            '"Historical aggregate data cannot represent every present-day local housing condition.",',
            '"The target is a historical 1990 median block-group value, not a current individual-property valuation.",')
          replace_once(p,
            '"Model quality is limited by the original feature set and sampling assumptions.",',
            '"Final evidence comes from one deterministic held-out split; it does not establish temporal or population-wide generalisation.",')

          # Remove deployment-sounding language from self-contained portfolio demonstrations.
          replace_once("src/app/demo/jobpilot-ai/page.tsx", "Try the evidence-grounding engine, live", "Try the evidence-grounding engine in-browser")
          replace_once("src/app/demo/jobpilot-ai/page.tsx", "Runs entirely in your browser. Edit the CV or job description below and watch the match score,", "This simplified portfolio demonstration runs entirely in your browser with synthetic sample text and no provider call. Edit the CV or job description below and watch the match score,")
          replace_once("src/app/demo/business-insight/page.tsx", "Ask the sample sales data, live", "Ask the sample sales data in-browser")
          replace_once("src/app/demo/business-insight/page.tsx", "Same reasoning as the other live demos on this site: genuinely", "This is an embedded portfolio interaction rather than evidence of the source repository's hosted deployment. It is genuinely")
          replace_once("src/app/demo/rag-assistant/page.tsx", "Try the extractive mode, live", "Try the simplified extractive mode in-browser")
          replace_once("src/app/demo/rag-assistant/page.tsx", "demo: genuinely live, clearly labeled as the simplified path.", "demo: interactive in-browser and clearly labeled as the simplified path, not as hosted-deployment evidence.")

          # Dataset-scoped Skill Analyzer presentation.
          skill = "src/app/demo/job-market-analyzer/page.tsx"
          replace_once(skill, "Live analysis output", "Deterministic sample analysis")
          replace_once(skill, "Run it yourself with real data via the\n        Streamlit app in the repo.", "The figures below describe only this non-representative sample; the repository supports other explicitly permitted datasets.")
          replace_once(skill, "Most in-demand skills", "Most frequent skills in this sample")
          replace_once(skill, "Skills that appear together most often", "Recurring skill pairs in this sample")
          replace_once(skill, "Sample gap report", "Entered-skill comparison")
          replace_once(skill, "Against an example skill set:", "Literal comparison against an example entered-skill list:")
          replace_once(skill, "Missing (high demand)", "Recurring sample terms not entered")
          replace_once(skill, "Coverage of high-demand skills:", "Coverage of recurring sample skills:")
          replace_once(skill, "      </section>\n    </div>\n  );", "        <p className=\"mt-4 text-xs leading-relaxed text-paper-dim\">Absence from this entered list does not prove a person lacks a skill. These percentages describe only the 40 synthetic postings; they are not market-demand, ATS or hiring scores.</p>\n      </section>\n    </div>\n  );")

          # Replace stale ML client model presentation with current JR05 evidence.
          Path("src/app/demo/ml-prediction/page.tsx").write_text('''import Link from "next/link";\nimport model from "@/lib/housing-model.json";\n\nexport const metadata = { title: "ML Prediction App — Current JR05 evidence" };\n\ntype Metrics = typeof model;\nconst metrics = model as Metrics;\n\nexport default function MlPredictionDemo() {\n  const validation = metrics.validation_metrics;\n  const finalTest = metrics.final_test_metrics;\n  const split = metrics.split.row_counts;\n  const sample = metrics.sample_predictions[0];\n\n  return (\n    <div className="mx-auto max-w-3xl px-6 py-16">\n      <Link href="/projects/ml-prediction-app" className="font-mono text-xs uppercase tracking-widest text-paper-dim hover:text-signal-amber">\n        ← Back to case study\n      </Link>\n\n      <h1 className="mt-6 font-display text-3xl font-bold text-paper">Current JR05 evaluation evidence</h1>\n      <p className="mt-3 text-paper-dim leading-relaxed">\n        This portfolio view presents the source repository&apos;s generated metrics rather than simulating the serving model.\n        Candidate selection uses validation RMSE; the final test is untouched until after Random Forest is selected and refit.\n      </p>\n\n      <div className="mt-8 grid gap-6 sm:grid-cols-3">\n        <div className="rounded-sm border border-ink-line bg-ink-raised p-5">\n          <p className="font-mono text-xs uppercase tracking-widest text-paper-dim">Train</p>\n          <p className="mt-1 font-display text-3xl font-bold text-paper">{split.train.toLocaleString()}</p>\n        </div>\n        <div className="rounded-sm border border-ink-line bg-ink-raised p-5">\n          <p className="font-mono text-xs uppercase tracking-widest text-paper-dim">Validation</p>\n          <p className="mt-1 font-display text-3xl font-bold text-paper">{split.validation.toLocaleString()}</p>\n        </div>\n        <div className="rounded-sm border border-ink-line bg-ink-raised p-5">\n          <p className="font-mono text-xs uppercase tracking-widest text-paper-dim">Final test</p>\n          <p className="mt-1 font-display text-3xl font-bold text-paper">{split.test.toLocaleString()}</p>\n        </div>\n      </div>\n\n      <section className="mt-10">\n        <h2 className="font-display text-sm font-bold uppercase tracking-widest text-signal-amber">Validation selection</h2>\n        <div className="mt-4 grid gap-6 sm:grid-cols-2">\n          <MetricCard title="Linear Regression" rmse={validation.linear_baseline.rmse} mae={validation.linear_baseline.mae} r2={validation.linear_baseline.r2} />\n          <MetricCard title="Random Forest — selected" rmse={validation.random_forest.rmse} mae={validation.random_forest.mae} r2={validation.random_forest.r2} />\n        </div>\n      </section>\n\n      <section className="mt-10 rounded-sm border border-verified-sage/40 bg-ink-raised p-6">\n        <p className="tag tag-verified mb-3">Untouched final test · Random Forest</p>\n        <div className="grid grid-cols-3 gap-4 text-sm">\n          <div><p className="text-paper-dim">RMSE</p><p className="font-mono text-paper">{finalTest.rmse}</p></div>\n          <div><p className="text-paper-dim">MAE</p><p className="font-mono text-paper">{finalTest.mae}</p></div>\n          <div><p className="text-paper-dim">R²</p><p className="font-mono text-paper">{finalTest.r2}</p></div>\n        </div>\n        <p className="mt-4 text-xs leading-relaxed text-paper-dim">\n          R² is variance explained on this historical held-out split, not 82.9% prediction accuracy or confidence.\n        </p>\n      </section>\n\n      <section className="mt-10">\n        <h2 className="font-display text-sm font-bold uppercase tracking-widest text-paper">Example held-out prediction</h2>\n        <p className="mt-3 text-sm text-paper-dim">\n          Generated source evidence: predicted {sample.predicted_value_100k} vs actual {sample.actual_value_100k} in $100,000 dataset units.\n          The target is a 1990 median block-group value, not a current individual-property valuation.\n        </p>\n      </section>\n\n      <section className="mt-12">\n        <h2 className="font-display text-sm font-bold uppercase tracking-widest text-blocked-rose">Limitations</h2>\n        <ul className="mt-3 space-y-2">\n          {metrics.limitations.map((note) => (\n            <li key={note} className="flex gap-3 text-sm leading-relaxed text-paper-dim">\n              <span className="dot mt-2 text-blocked-rose" />\n              <span>{note}</span>\n            </li>\n          ))}\n        </ul>\n      </section>\n    </div>\n  );\n}\n\nfunction MetricCard({ title, rmse, mae, r2 }: { title: string; rmse: number; mae: number; r2: number }) {\n  return (\n    <div className="rounded-sm border border-ink-line bg-ink-raised p-5">\n      <p className="font-display text-sm font-bold text-paper">{title}</p>\n      <dl className="mt-3 space-y-1 text-sm text-paper-dim">\n        <div className="flex justify-between"><dt>RMSE</dt><dd className="font-mono text-paper">{rmse}</dd></div>\n        <div className="flex justify-between"><dt>MAE</dt><dd className="font-mono text-paper">{mae}</dd></div>\n        <div className="flex justify-between"><dt>R²</dt><dd className="font-mono text-paper">{r2}</dd></div>\n      </dl>\n    </div>\n  );\n}\n''')

          # README/status/presentation handoff synchronization.
          replace_once("README.md", "Reproducible data pipelines, baseline-vs-model ML evaluation and validated inference.", "Reproducible data pipelines, validation-based model selection with untouched final-test evaluation, and validated inference.")
          replace_once("README.md", "## Deployment status", "## Final technical synchronisation\n\nJR06A revalidated the five source repositories on 6 September 2026. Repository readiness is current; deployment freshness remains a separate condition and no source-project public demo is claimed without a fresh core-interaction smoke.\n\n## Deployment status")

          Path("PROJECT_STATUS.md").write_text('''# Portfolio project status\n\n_Last reviewed for JR06A: 6 September 2026_\n\n## Current state\n\nThe portfolio represents five public, repository-ready projects in recruiter-first order:\n\n1. JobPilot AI\n2. LLM Business Insight Assistant\n3. RAG Research Assistant\n4. AI Job Market Skill Analyzer\n5. ML Prediction App\n\nRepository-ready, freshly deployed and production-ready are separate claims. All five source repositories were re-read at their current default-branch commits during JR06A; source-project `liveDemoAvailable` remains false unless a current hosted core interaction is actually observed.\n\n## Source revisions synchronised\n\n- JobPilot AI — `6cccc87eb36f779d71f021866f2f939c4d5bb133`\n- LLM Business Insight Assistant — `cc909939a49ba6e1c8204b838c4089df84c9b333`\n- RAG Research Assistant — `f024409cc95775933fcf78c9d31c484dcc981ef5`\n- AI Job Market Skill Analyzer — `2db2b5ee870f154fc41fdfc5c54e93d44dcaa68d`\n- ML Prediction App — `04aae0183f027d87ed24eb48b65787e81f608651`\n\n## JR06A claim corrections\n\n- JobPilot now surfaces the explicit default-off provider/privacy boundary and current 44-test/OSV evidence.\n- Business Insight now surfaces the current 109-test Python 3.10–3.12 evidence while retaining 49/49 as a historical scoped benchmark.\n- RAG exposes answer/refusal limitations alongside retrieval metrics rather than cherry-picking retrieval quality.\n- Skill Analyzer uses dataset-scoped frequency/co-occurrence and entered-skill comparison language; its 40-posting sample is explicitly synthetic and non-representative.\n- ML Prediction now reflects validation-based model selection, selected-model refit and one untouched final-test evaluation; R² is not described as accuracy.\n\n## Deployment and media boundary\n\nRecorded historical deployment candidates remain evidence to re-smoke, not automatic live claims. Embedded portfolio interactions are labelled as in-browser demonstrations rather than source-project hosted deployments. Current screenshots should use synthetic/public data and must not be presented as proof of deployment unless the running build is freshly verified.\n\n## Accuracy rule\n\nEvery public claim must be supported by current source code, tests, CI, a scoped evaluation report or a fresh smoke test. Repositories are job-readiness verified; deployment freshness is a separate condition.\n''')

          Path("AI_HANDOFF.md").write_text('''# AI Handoff — Meet Tala Portfolio\n\nAlways re-read the live repository and each linked project before changing public claims. Never invent deployments, screenshots, users, metrics, business outcomes or capabilities.\n\n## JR06A repository state\n\n- Repository: `Meettala/meet-tala-portfolio`\n- Default branch: `main`\n- Stack: Next.js 16.2.11, React 19, TypeScript, Tailwind CSS 4, Vitest, Docker\n- Last synchronized: 6 September 2026\n\n## Recruiter order\n\n1. JobPilot AI\n2. LLM Business Insight Assistant\n3. RAG Research Assistant\n4. AI Job Market Skill Analyzer\n5. ML Prediction App\n\n`src/lib/projects.ts` is the recruiter-facing source of truth. Keep `repositoryReady`, `liveDemoAvailable` and production-readiness claims separate.\n\n## Source revisions synchronized by JR06A\n\n- JobPilot — `6cccc87eb36f779d71f021866f2f939c4d5bb133`\n- Business Insight — `cc909939a49ba6e1c8204b838c4089df84c9b333`\n- RAG — `f024409cc95775933fcf78c9d31c484dcc981ef5`\n- Skill Analyzer — `2db2b5ee870f154fc41fdfc5c54e93d44dcaa68d`\n- ML Prediction — `04aae0183f027d87ed24eb48b65787e81f608651`\n\n## Boundaries to preserve\n\n- JobPilot: evidence-grounded default, explicit/default-off provider mode, privacy notice, propose-only tracker, no auto-apply or current public-deployment claim.\n- Business Insight: validated QuerySpec and fixed pandas executor, no generated Python/SQL execution; 49/49 is a historical scoped benchmark, not universal accuracy.\n- RAG: lexical retrieval and known answer/refusal failures must stay visible beside evaluation metrics.\n- Skill Analyzer: 40-posting synthetic/non-representative sample; report sample frequency/co-occurrence and entered-skill comparison, not market demand or personal deficiency.\n- ML Prediction: validation selects the model; final test does not. R² is variance explained, not accuracy; output is historical block-group estimation, not property valuation.\n\nDo not begin CV writing or a later portfolio programme step unless explicitly requested.\n''')

          guide = Path("docs/PORTFOLIO_PRESENTATION_GUIDE.md").read_text()
          guide = guide.replace("1. JobPilot AI\n2. RAG Research Assistant\n3. LLM Business Insight Assistant", "1. JobPilot AI\n2. LLM Business Insight Assistant\n3. RAG Research Assistant")
          guide = guide.replace("- Capture one real screenshot of the deployed homepage.", "- Capture current product evidence in priority order: JobPilot, LLM Business Insight, then RAG. A local/current-build screenshot is acceptable when presented as a product screenshot rather than deployment proof.\n- Use synthetic/public-safe inputs only; exclude CV data, API keys, filesystem paths and private tabs.")
          Path("docs/PORTFOLIO_PRESENTATION_GUIDE.md").write_text(guide)

          # Claim-regression tests for the two load-bearing corrections.
          tests = Path("tests/projects.test.ts")
          text = tests.read_text()
          text = text.replace('import { describe, expect, it } from "vitest";\n', 'import { readFileSync } from "node:fs";\nimport { describe, expect, it } from "vitest";\n')
          marker = '\n});\n'
          addition = '''\n\n  it("keeps Skill Analyzer recruiter copy dataset-scoped", () => {\n    const project = projects.find((item) => item.slug === "job-market-skill-analyzer");\n    const publicCopy = JSON.stringify(project);\n    expect(publicCopy).not.toMatch(/market demand|high-demand|candidate[- ]gap|demand frequency/i);\n    expect(publicCopy).toMatch(/synthetic|sample|analysed|dataset/i);\n\n    const demo = readFileSync("src/app/demo/job-market-analyzer/page.tsx", "utf8");\n    expect(demo).not.toMatch(/Most in-demand|Missing \(high demand\)|Coverage of high-demand/i);\n    expect(demo).toMatch(/Most frequent skills in this sample/);\n  });\n\n  it("keeps ML model selection separate from final-test evidence", () => {\n    const project = projects.find((item) => item.slug === "ml-prediction-app");\n    const publicCopy = JSON.stringify(project);\n    expect(publicCopy).toMatch(/validation RMSE/i);\n    expect(publicCopy).toMatch(/final test|final-test/i);\n    expect(publicCopy).toMatch(/not 82\.9% prediction accuracy/i);\n\n    const demo = readFileSync("src/app/demo/ml-prediction/page.tsx", "utf8");\n    expect(demo).not.toMatch(/reported accuracy/i);\n    expect(demo).toMatch(/untouched final test/i);\n  });\n'''
          idx = text.rfind(marker)
          if idx < 0:
              raise SystemExit("tests closing marker not found")
          text = text[:idx] + addition + text[idx:]
          tests.write_text(text)
          PY

          curl -fsSL "https://raw.githubusercontent.com/Meettala/ml-prediction-app/04aae0183f027d87ed24eb48b65787e81f608651/exports/metrics.json" -o src/lib/housing-model.json

      - name: Verify portfolio after synchronization
        run: |
          npm ci
          npm run verify

      - name: Guard unsafe stale phrases
        run: |
          ! grep -RniE 'Most in-demand skills|Missing \(high demand\)|Coverage of high-demand skills|reported accuracy' src/lib src/app/demo

      - name: Commit synchronized portfolio and remove helper
        run: |
          git rm .github/workflows/jr06a-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md PROJECT_STATUS.md AI_HANDOFF.md docs/PORTFOLIO_PRESENTATION_GUIDE.md src tests
          git commit -m "JR06A: synchronize final portfolio evidence"
          git push origin HEAD:jr06a/final-portfolio-sync
