name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Refresh vulnerable lockfile packages
        run: npm update --package-lock-only brace-expansion browserslist js-yaml nanoid postcss

      - name: Install dependencies
        run: npm ci

      - name: Explain remediated dependency chains
        run: |
          npm explain nanoid
          npm explain js-yaml
          npm explain browserslist
          npm explain postcss
          npm explain brace-expansion

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build production application
        run: npm run build

      - name: Commit refreshed lockfile
        if: github.event_name == 'pull_request'
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "JR01B: refresh vulnerable dependency lockfile"
          git push origin HEAD:${GITHUB_HEAD_REF}

  dependency-scan:
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.8
    with:
      scan-args: |-
        --lockfile=package-lock.json
      upload-sarif: false
      fail-on-vuln: true
    permissions:
      actions: read
      contents: read
      security-events: write
